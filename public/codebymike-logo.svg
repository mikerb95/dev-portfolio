<svg viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo horizontal: símbolo + texto compacto -->

  <!-- Símbolo: brackets de código -->
  <g id="code-symbol">
    <!-- Left bracket < -->
    <path d="M 12 18 L 18 30 L 12 42" stroke="#00f2ff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right bracket > -->
    <path d="M 28 18 L 22 30 L 28 42" stroke="#00f2ff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Texto: CodeByMike sin espacios -->
  <text x="42" y="38" font-family="Monaco, Courier New, monospace" font-size="20" font-weight="600" letter-spacing="0" fill="#f0f0f0">Code<tspan fill="#00f2ff">By</tspan><tspan fill="#f0f0f0">Mike</tspan></text>
</svg>
