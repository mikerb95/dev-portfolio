<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CodeByMike">
  <defs>
    <!-- El glow va solo en el cursor: a 16px es lo que hace que el cyan se lea
         como acento de marca y no como un pixel perdido -->
    <filter id="cursor-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="12" fill="#0a0a0d"/>

  <!-- M de Mike trazada a mano en vez de con <text>: un favicon se renderiza
       en contextos sin acceso a JetBrains Mono (pestañas, PWA, .ico) -->
  <path
    d="M17 45 L17 20 L26 33 L35 20 L35 45"
    fill="none"
    stroke="#e7e7ec"
    stroke-width="6.5"
    stroke-linecap="butt"
    stroke-linejoin="miter"
  />

  <!-- Cursor de bloque de terminal -->
  <rect x="44.5" y="19" width="6.5" height="26" fill="#00f2ff" filter="url(#cursor-glow)"/>
</svg>
